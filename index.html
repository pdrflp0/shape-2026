  <style>
    /* mesma posição/tamanho da tela de abertura do iOS (icons/splash-*.png) para a transição não "pular" */
    #splash { position: fixed; inset: 0; z-index: 200; background: #07080a; transition: opacity .4s; }
    #splash.gone { opacity: 0; pointer-events: none; }
    #splash .lg { position: absolute; left: 50%; top: 44%; width: 24vmin; height: 24vmin; margin: -12vmin 0 0 -12vmin; border-radius: 23%; background: #c6ff3d; animation: sp 1.2s ease-in-out infinite; }
    #splash .lg svg { width: 100%; height: 100%; }
    @keyframes sp { 50% { transform: scale(.92); } }
  </style>

  <div id="splash"><div class="lg"><svg viewBox="0 0 100 100" fill="#07080a"><rect x="26" y="46.5" width="48" height="7" rx="2"/><rect x="25.5" y="30" width="9" height="40" rx="3"/><rect x="65.5" y="30" width="9" height="40" rx="3"/><rect x="18" y="37" width="7" height="26" rx="2.5"/><rect x="75" y="37" width="7" height="26" rx="2.5"/></svg></div></div>
